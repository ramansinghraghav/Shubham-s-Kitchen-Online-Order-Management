{% extends 'base.html' %}
{% block title %}{{ status_code }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="mx-auto text-center p-5 bg-white border rounded-4 shadow-sm" style="max-width: 640px;">
        <div class="display-5 fw-bold text-dark mb-2">{{ status_code }}</div>
        <h1 class="h3 mb-3">{{ error_title }}</h1>
        <p class="text-muted mb-4">{{ error_message }}</p>
        <a href="/" class="btn btn-warning">Back to home</a>
    </div>
</div>
{% endblock %}
